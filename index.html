<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm de Aura · lilgiela33</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <main class="stage">
    <h1>Farm de Aura da lilgiela33</h1>
    <div class="score" id="score">0</div>
    <p class="sub">aura · <span id="aps">0</span> por segundo · <span id="apc">1</span> por clique</p>
    <span class="title" id="rank">Sem aura</span>
    <div class="orb-box"><button id="orb" aria-label="Farmar aura">+ AURA</button></div>
    <div class="tools">
      <button id="theme">Trocar tema</button>
      <button id="reset">Zerar progresso</button>
    </div>
  </main>
  <aside>
    <section class="panel" style="margin-bottom:14px"><h2>Melhorias de clique</h2><div id="ups"></div></section>
    <section class="panel"><h2>Geradores de aura</h2><div id="gens"></div></section>
  </aside>
</div>
<script src="script.js"></script>
</body>
</html>
